######################################################################################################################################################
# Filament auto load based on user parameters. This contains the meat of the prompting.
######################################################################################################################################################
[delayed_gcode sifm_load_filament]
gcode:
  {% set printer_status = printer["gcode_macro _SIFM_VARS"].status %}
  {% set active_spool = printer["gcode_macro _SIFM_VARS"].active_spool %}
  {% set last_spool = printer["gcode_macro _SIFM_VARS"].last_spool %}
  {% set user_wait = printer["gcode_macro _SIFM_VARS"].user_wait %}
  {% set load_stage = printer["gcode_macro _SIFM_VARS"].load_stage %} ; "Idle", "Selection", "Heating", "Loading", "Purging"
  {% set tip_distance = printer["gcode_macro _SIFM_USER"].tip_distance | default(35) | int %} ; in mm
  {% set load_speed = printer["gcode_macro _SIFM_USER"].load_speed | default(30) | int %} ; in mm/s
  {% set purge_speed = printer["gcode_macro _SIFM_USER"].purge_speed | default(5) | int %} ; in mm/s
  
  # Waiting for user input
  {% if user_wait %}
    G4 P250
    UPDATE_DELAYED_GCODE ID=sifm_load_filament DURATION=0.1

  {% elif load_stage == "Idle" %}
    # If there's a spool loaded, then prompt the user.
    {% if active_spool.id != -1 %}
      _SIFM_WAIT
      RESPOND TYPE=command MSG="action:prompt_begin SIFM"
      RESPOND TYPE=command MSG="action:prompt_text Filament '" ~ {active_spool.name} ~ "' is currently loaded."
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      RESPOND TYPE=command MSG="action:prompt_button Load This Filament|_SIFM_RELOAD_FILAMENT|primary"
      RESPOND TYPE=command MSG="action:prompt_button Load Another Filament|_SIFM_LOAD_STAGE STAGE="Selection"|secondary"
      RESPOND TYPE=command MSG="action:prompt_button Unload|_SIFM_UNLOAD|warning"
      RESPOND TYPE=command MSG="action:prompt_button Cancel|SIFM_CANCEL TOCANCEL=sifm_load_filament|error"

    {% else %}
      _SIFM_LOAD_STAGE STAGE="Selection"

    {% endif %}
      _SIFM_STATUS STATUS="Loading"
  
  {% elif load_stage == "Selection" %}
    _SIFM_MATS

  {% elif load_stage == "Heating" %}

  {% elif load_stage == "Loading" %}
    _SIFM_WAIT
    RESPOND TYPE=command MSG="action:prompt_begin SIFM"
    RESPOND TYPE=command MSG="action:prompt_text Push the filament into the extruder."
    RESPOND TYPE=command MSG="action:prompt_button Continue|_SIFM_STATUS STATUS="Loading"|primary"
    RESPOND TYPE=command MSG="action:prompt_button CANCEL|SIFM_CANCEL TOCANCEL=sifm_load_filament|error"
    RESPOND TYPE=command MSG="action:prompt_show"

  {% elif load_stage == "Purging" %}
    _SIFM_WAIT
    RESPOND TYPE=command MSG="action:prompt_begin SIFM"
    RESPOND TYPE=command MSG="action:prompt_text Loading..."
    RESPOND TYPE=command MSG="action:prompt_button CANCEL|SIFM_CANCEL TOCANCEL=sifm_load_filament|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    M83
    G1 E3 S60
    G1 E{tip_distance} S{load_speed * 60}

  {% endif %}



######################################################################################################################################################
# Custom load macro that allows the user to interrupt during the sequence; may be called manually. Stores and reads previously loaded filament
# to account for large temperature differences, i.e. PC -> PLA
######################################################################################################################################################
[gcode_macro SIFM_LOAD]
gcode:
  {% set ex_temp = params.EXTRUDER | default(-1) | int %}
  {% set bed_temp = params.BED | default(-1) | int %}
  {% set spool_id = params.SPOOL | default(-1) | int %}
  {% set spool = printer["gcode_macro _SIFM_VARS"].spools[spool_id] %}
  {% set active_spool = printer["gcode_macro _SIFM_VARS"].active_spool %}
  {% set status = printer["gcode_macro _SIFM_VARS"].status %}
  
  M104 S{ex_temp}
  M140 S{bed_temp}

  {% (if ex_temp == -1 or bed_temp == -1) and spool_id == -1 %}
    M118 SIFM: Error: Missing parameters!
    SIFM_CANCEL

  {% elif spool_id != -1 %}
    {% if spool.name == none %}
      M118 SIFM: Error: Invalid Spool ID!
      SIFM_CANCEL
    {% endif %}

    # If no temp explicitly set, override with the spool value
    {% if ex_temp == -1 and bed_temp != -1 %}
      {% set ex_temp = spool.ex_temp %}
    {% endif %}
    {% if ex_temp != -1 and bed_temp == -1 %}
      {% set bed_temp = spool.bed_temp %}
    {% endif %}

  # Move the current loaded spool into the previous spool, then save the selected spool and load it into Spoolman.
    SAVE_VARIABLE VARIABLE=last_spool VALUE={active_spool}
    SAVE_VARIABLE VARIABLE=loaded_spool VALUE={spool}
    
  {% endif %}

  {% if status == "Loading" %}
    _SIFM_LOAD_STAGE STAGE="Heating"
  
  {% elif status == "Unloading" %}
  {% endif %}



######################################################################################################################################################
# Special case for the event that you want to load the spool that is currently active
######################################################################################################################################################
[gcode_macro _SIFM_RELOAD_FILAMENT]
gcode:
  {% set active_spool = printer["gcode_macro _SIFM_VARS"].active_spool %}
  SIFM_LOAD SPOOL={active_spool.id}
  _SIFM_LOAD_STAGE STAGE="Heating"
  _SIFM_RESUME
  

######################################################################################################################################################
# Set the current stage of the Load process
######################################################################################################################################################
[gcode_macro _SIFM_LOAD_STAGE]
gcode:
  {% set load_stage = params.STAGE | default("Idle") | string %}
  {% set spool = params.SPOOL | default(none) %}

  {% if spool != none %}
    SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=active_spool VALUE="'{spool}'"
  {% endif %}
  _SIFM_RESUME
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=load_stage VALUE="'{load_stage}'"

