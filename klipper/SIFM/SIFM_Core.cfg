######################################################################################################################################################
# TODO: Add LED integration.
# Update the status of SIFM. Accepted statuses: "Idle", "Loading", "Unloading", "Alert"
######################################################################################################################################################
[gcode_macro _SIFM_CHANGE_STATUS]
gcode:
  {% set target_status = params.STATUS | default("Idle") | string %}
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=status VALUE="'{target_status}'"



######################################################################################################################################################
# Set the current stage of the Load/Unload process. Automatically resumes from a pause and runs the proper delayed gcode.
######################################################################################################################################################
[gcode_macro _SIFM_CHANGE_STAGE]
gcode:
  {% set printer_status = printer["gcode_macro _SIFM_VARS"].status | string %}
  {% set filament_stage = params.STAGE | default("Idle") | string %}
  {% set spool_id = params.SPOOL_ID | default(-1) | int %}
  {% set spools = printer["gcode_macro _SIFM_VARS"].spools %}

  {% if spool_id > -1 %}
    SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=active_spool VALUE='"{spools[spool_id]}"'
  {% endif %}
  _SIFM_RESUME
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=filament_stage VALUE='"{filament_stage}"'

  {% if filament_stage != "Idle" %}
    {% if printer_status == "Loading" %}
      UPDATE_DELAYED_GCODE ID=sifm_load_filament DURATION=0.5
    {% elif printer_status == "Unloading" %}
      UPDATE_DELAYED_GCODE ID=sifm_unload_filament DURATION=0.5
    {% endif %}
  {% endif %}


[gcode_macro _SIFM_STAGE]
gcode:
  {% set filament_stage = printer["gcode_macro _SIFM_VARS"].filament_stage %}
  M118 "{filament_stage}"

######################################################################################################################################################
# Startup initialization
######################################################################################################################################################
[delayed_gcode sifm_init]
initial_duration: 3
gcode:
  {% set default_spool = printer["gcode_macro _SIFM_VARS"].default_spool %}
  
  {% if 'id' in printer.save_variables.variables.last_spool %}
    {% set last_spool = printer.save_variables.variables.last_spool %}
  {% else %}
    {% set last_spool = default_spool %}
  {% endif %}
  
  {% if 'id' in printer.save_variables.variables.active_spool %}
    {% set active_spool = printer.save_variables.variables.active_spool %}
  {% else %}
    {% set active_spool = default_spool %}
  {% endif %}

  # Calculate linear speed from cubic data
  {% set cubic_purge_speed = printer["gcode_macro _SIFM_USER"].cubic_purge_speed | default(8) %}
  {% set purge_length = printer["gcode_macro _SIFM_USER"].purge_length | default(50) %}
  {% set diameter = printer["gcode_macro _SIFM_USER"].filament_diameter | default(1.75) %}
  {% set purge_volume = ((diameter / 2) ** 2) * 3.14 | float %} ; Gives the number of mm3 per mm
  {% set purge_speed = (cubic_purge_speed / purge_volume) * 60 | float %} ; Sets the purge speed in mm/m
  {% set spoolman_address = printer["gcode_macro _SIFM_USER"].spoolman_address %}

  # Get an initial list of the Spoolman spools
  SIFM_QUERY
  # Spools
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=last_spool VALUE="{last_spool}"
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=active_spool VALUE="{active_spool}"
  # Purge
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=purge_speed VALUE="{purge_speed}"

  {action_respond_info("SIFM: Spools:\nActive: " ~ active_spool ~ "\nPrevious: " ~ last_spool)}

######################################################################################################################################################
# Enable/disable SIFM pause; used to wait for something, ususally a user prompt.
######################################################################################################################################################
[gcode_macro _SIFM_PAUSE]
gcode:
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=paused VALUE=True
  
[gcode_macro _SIFM_RESUME]
gcode:
  SET_GCODE_VARIABLE MACRO=_SIFM_VARS VARIABLE=paused VALUE=False



######################################################################################################################################################
# Macros for managing the Spoolman/Mainsail integration
######################################################################################################################################################
[gcode_macro SET_ACTIVE_SPOOL]
gcode:
    {% if params.ID %}
        {action_call_remote_method(
            "spoolman_set_active_spool",
            spool_id=params.ID|int
        )}
        {action_respond_info("Spool %s is now active." % params.ID)}
    {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
    {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}
    {action_respond_info("Active spool has been cleared.")}


######################################################################################################################################################
# Global variables used in the SIFM suite
######################################################################################################################################################
[gcode_macro _SIFM_VARS]
variable_paused: False
variable_query_running: False
variable_active_gcodes: []
variable_purge_speed: -1
variable_extrude_loops: 0
variable_status: "Idle"
  # Accepted statuses: "Idle", "Loading", "Unloading", "Alert"
  # "Idle" is essentially treated as "task complete"; if the status is something other than idle, a macro knows it has begun.
variable_filament_stage: "Idle"
  # Accepted stages: "Idle", "Check", "Mats", "Filaments", "Loading", "Purging"
variable_spools: [] 
  # This will contain a list of dictionaries structured as follows
  # name: Spool name
  # material: The filament material (ABS, PLA, ABS-GF, etc.)
  # ex_temp: Extruder temperature
  # bed_temp: Bed temperature
  # id: The unique Spoolman ID
variable_unique_mats: []
  # Unique materials from _SIFM_RECEIVE
variable_default_spool: {"name": "", "material": "", "ex_temp": -1, "bed_temp": -1, "id": -1, "abrasive": False}
variable_active_spool: {}
variable_last_spool: {}
  # Both of these variables are compatible with the "spools" list
variable_transition_mode: False
  # Whether or not we are transitioning materials with a large temperature gap
gcode:
  


