######################################################################################################################################################
# To be called before PRINT_START. This will check if a spool was specified in the slicer, then call other macros accordingly.
######################################################################################################################################################
[gcode_macro SIFM_START]
variable_print_spool_id: -1
gcode:
  {% set spool_id = params.SPOOL_ID | default(-1) | int %}
  {% set is_print_active = printer['virtual_sdcard'].is_active or printer['virtual_sdcard'].file_position != 0.0 %}

  {% if spool_id == -1 %}
    {action_respond_info("SIFM: No print spool specified, skipping gcode verification.")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=SIFM_START VARIABLE=print_spool_id VALUE={spool_id}
    UPDATE_DELAYED_GCODE ID=sifm_verify DURATION=0.5
  {% endif %}



######################################################################################################################################################
# Check for conflicts, prompt the user, and call their respective actions.
######################################################################################################################################################
[delayed_gcode sifm_verify]
gcode:
  {% set print_spool_id = printer["gcode_macro SIFM_START"].print_spool_id %}
  {% set hardened_nozzle = printer["gcode_macro _SIFM_USER"].variable_hardened_nozzle %}
  {% set abrasive_diameter = printer["gcode_macro _SIFM_USER"].abrasive_diameter %}
  {% set nozzle_diameter = printer.extruder.nozzle_diameter %}
  {% set query_running = printer["gcode_macro _SIFM_VARS"].query_running %}
  {% set active_spool = printer["gcode_macro _SIFM_VARS"].active_spool %}
  {% set print_spool = printer["gcode_macro _SIFM_VARS"].spools[print_spool_id] %}
  {% set conflicts = [] %}

  SIFM_QUERY

  {% if query_running %}
    UPDATE_DELAYED_GCODE ID=sifm_verify DURATION=0.5
  {% else %}
  # Various checks:
    # Sliced spool matches the active spool. It seems redundant, so I'm leaving it disabled for now.
    # {% if active_spool.id != print_spool_id %}
    #   {% set conflicts[(conflicts | length) - 1] = "ID Mismatch" %}
    # {% endif %}

    # Material matches the active material
    {% if active_spool.material != print_spool.material %}
      {% set conflicts[(conflicts | length) - 1] = "Material Mismatch" %}
    {% endif %}

    # Abrasive material without abrasive nozzle
    {% if print_spool.abrasive and not hardened_nozzle %}
      {% set conflicts[(conflicts | length) - 1] = "Abrasive Material with Soft Nozzle" %}
    # Abrasive material with a nozzl below threshold size
    {% elif abrasive_diameter > nozzle_diameter %}
      {% set conflicts[(conflicts | length) - 1] = "Nozzle Diameter Too Small" %}
    {% endif %}
    
    # If the conflicts array isn't empty, prompt for the conflicts. Otherwise, continue printing.
    {% if conflicts %}
      RESPOND TYPE=command MSG="action:prompt_begin SIFM Checks"
      RESPOND TYPE=command MSG="action:prompt_text The following conflicts were detected:"
      {% for conflict in conflicts %}
        RESPOND TYPE=command MSG="action:prompt_text '{conflict}'"
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_footer_button Ignore|_SIFM_START_CONTINUE|warning"
      RESPOND TYPE=command MSG="action:prompt_footer_button Change Filament|UPDATE_DELAYED_GCODE ID=sifm_start_change DURATION=0.5|secondary"
      RESPOND TYPE=command MSG="action:prompt_footer_button Abort|PRINT_END|error"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
      _SIFM_START_CONTINUE
    {% endif %}

  {% endif %}



######################################################################################################################################################
# Resume printing.
######################################################################################################################################################
[gcode_macro _SIFM_START_CONTINUE]
gcode:
  {% if printer['pause_resume'].is_paused  %}
      RESUME
  {% endif %}



######################################################################################################################################################
# Change filament before printing.
######################################################################################################################################################
[delayed_gcode sifm_start_change]
gcode:
  {% set printer_status = printer['gcode_macro _SIFM_VARS'].printer_status %}

  _SIFM_CHANGE_STATUS: "Unloading"
	_SIFM_CHANGE_STAGE: "Unloading"